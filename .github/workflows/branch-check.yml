name: Branch Check

on:
  push:
    branches-ignore: [main]

concurrency:
  group: branch-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-open-pr:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.open-pr.outputs.exists }}
    steps:
      - id: open-pr
        name: Detect an open pull request for this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
            --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: detect-open-pr
    if: needs.detect-open-pr.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: openclaw-lancedb-knowledge/assets/knowledge-lancedb-template/package-lock.json
      - run: bash scripts/check_push.sh
