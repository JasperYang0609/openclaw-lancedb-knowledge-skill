name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openclaw-lancedb-knowledge/assets/knowledge-lancedb-template
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541dca151540f75c6d2b05d7d4e01f
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: openclaw-lancedb-knowledge/assets/knowledge-lancedb-template/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run postrun:check
      - name: Validate bootstrap script
        working-directory: .
        run: python3 -m py_compile openclaw-lancedb-knowledge/scripts/bootstrap_openclaw_lancedb.py openclaw-lancedb-knowledge/assets/knowledge-lancedb-template/scripts/snapshot_knowledge_assets.py tests/test_bootstrap_security.py tests/test_snapshot_knowledge_assets.py tests/test_skill_archive.py scripts/check_dangerous_exec.py scripts/check_gemini_product_boundary.py scripts/build_skill_archive.py
      - name: Test bootstrap execution boundary
        working-directory: .
        run: python3 tests/test_bootstrap_security.py
      - name: Test checksummed knowledge snapshot
        working-directory: .
        run: python3 tests/test_snapshot_knowledge_assets.py
      - name: Scan production execution surface
        working-directory: .
        run: python3 scripts/check_dangerous_exec.py
      - name: Verify packaged skill matches source
        working-directory: .
        run: |
          python3 tests/test_skill_archive.py
          python3 scripts/build_skill_archive.py --check
      - name: Verify Gemini-only product boundary
        working-directory: .
        run: python3 scripts/check_gemini_product_boundary.py
